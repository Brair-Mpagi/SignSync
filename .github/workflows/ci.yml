name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core job installs *only* the core dependency. Plan §17 requires the system
  # to run on a laptop with no GPU, no network and no optional extras, and the only
  # way that stays true is to keep proving it on every commit — a heavy import that
  # sneaks into a hot path fails here rather than in a clinic.
  core:
    name: core (numpy only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Assert the heavy extras really are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("torch", "mediapipe", "cv2") if importlib.util.find_spec(m)]
          if present:
              sys.exit(f"optional extras leaked into the core job: {present}")
          print("core environment is clean")
          PY

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

  # The client re-implements forward kinematics in JavaScript; this job is what
  # catches it drifting from the Python implementation. An arm bent the wrong way
  # is a different sign, and no Python test can see it.
  client:
    name: browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install -e ".[dev]"
      - name: Cross-check JS kinematics against Python
        run: pytest tests/test_client.py -q

  api:
    name: api (fastapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev,api]"
      - run: pytest tests/test_api.py tests/test_pipeline.py -q

      # Runs the same script a contributor and a pilot site run, rather than a
      # CI-only sequence that can drift from it.
      - name: End-to-end pipeline via run.sh
        run: ./run.sh --skip-setup --no-serve --force

      - name: The server must actually come up and report health
        run: |
          signsync serve --host 127.0.0.1 --port 8000 --model artifacts/recogniser.npz &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /tmp/health.json && break
            sleep 1
          done
          cat /tmp/health.json
          python -c "import json;h=json.load(open('/tmp/health.json'));assert h['capabilities']['recognition'], h"
          curl -sf http://127.0.0.1:8000/ | grep -q SignSync

  models:
    name: torch models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the models extra (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,models]"

      - run: pytest -q -m "requires_torch or not requires_torch"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start via run-docker.sh
        run: ./infrastructure/run-docker.sh --detach --demo

      - name: The container must serve, recognise, and translate
        run: |
          curl -sf http://localhost:8000/health > /tmp/health.json
          cat /tmp/health.json
          python - <<'PY'
          import json
          health = json.load(open("/tmp/health.json"))
          assert health["status"] == "ok", health
          # The demo bootstrap trains a model, so recognition must be live. Without
          # this assertion the container could serve happily while recognising
          # nothing, which is the failure the entrypoint exists to prevent.
          assert health["capabilities"]["recognition"], health
          PY
          curl -sf -X POST http://localhost:8000/api/english-to-sign \
            -H 'Content-Type: application/json' \
            -d '{"text":"Where is the hospital?"}' | grep -q HOSPITAL
          curl -sf http://localhost:8000/ | grep -q SignSync

      - name: A bad model path must stop the container, not start it broken
        run: |
          if docker run --rm -e SIGNSYNC_MODEL=/nope.npz signsync:latest; then
            echo "container started with a missing model — it must not" >&2
            exit 1
          fi

      - name: Participant data must not be in the image
        run: |
          # data/ and artifacts/ are .dockerignore'd; layers are cached and pushed,
          # so anything that lands in one is effectively undeletable.
          # find, not ls: `ls` given two directories prints a header per directory,
          # which a naive grep counts as content and turns into a false failure.
          count=$(docker run --rm --entrypoint sh signsync:latest -c 'find /data /artifacts -mindepth 1 | wc -l')
          echo "entries under /data and /artifacts: $count"
          test "$count" -eq 0

      - name: The demo model must not be written to the mounted volume
        run: |
          # A synthetic demo model left in artifacts/ is one somebody later mistakes
          # for a trained system.
          test -z "$(ls -A artifacts | grep -v README.md || true)"

      - name: Stop
        if: always()
        run: docker rm -f signsync || true
