name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core job installs *only* the core dependency. Plan §17 requires the system
  # to run on a laptop with no GPU, no network and no optional extras, and the only
  # way that stays true is to keep proving it on every commit — a heavy import that
  # sneaks into a hot path fails here rather than in a clinic.
  core:
    name: core (numpy only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Assert the heavy extras really are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("torch", "mediapipe", "cv2") if importlib.util.find_spec(m)]
          if present:
              sys.exit(f"optional extras leaked into the core job: {present}")
          print("core environment is clean")
          PY

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

  # The client re-implements forward kinematics in JavaScript; this job is what
  # catches it drifting from the Python implementation. An arm bent the wrong way
  # is a different sign, and no Python test can see it.
  client:
    name: browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install -e ".[dev]"
      - name: Cross-check JS kinematics against Python
        run: pytest tests/test_client.py -q

  api:
    name: api (fastapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev,api]"
      - run: pytest tests/test_api.py tests/test_pipeline.py -q

      - name: End-to-end pipeline on a synthetic corpus
        run: |
          signsync doctor
          signsync corpus build-synthetic /tmp/corpus --signers 8 --repeats 2
          signsync corpus stats /tmp/corpus
          signsync train /tmp/corpus --out /tmp/model.npz
          signsync demo speech-to-sign --text "Where is the hospital?"
          # Exits non-zero without a certified human evaluation round, which is the
          # designed behaviour (plan §15) — so the failure is expected here.
          signsync evaluate /tmp/corpus /tmp/model.npz || true

  models:
    name: torch models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the models extra (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,models]"

      - run: pytest -q -m "requires_torch or not requires_torch"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f infrastructure/Dockerfile -t signsync:ci .
      - name: The image must start and report its capabilities
        run: |
          docker run -d --name signsync-ci -p 8000:8000 signsync:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker rm -f signsync-ci
